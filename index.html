const d=parts.map(q=>{let z=[];q.forEach((c,i)=>z.push(...jag(c,q[(i+1)%q.length],3)));let w=[];z.forEach((c,i)=>{const n=z[(i+1)%z.length];w.push([.75*c[0]+.25*n[0],.75*c[1]+.25*n[1]],[.25*c[0]+.75*n[0],.25*c[1]+.75*n[1]])});return "M"+w.map(c=>c[0].toFixed(3)+","+(-c[1]).toFixed(3)).join("L")+"Z"}).join(""),f=parts[0],cx=(Math.min(...f.map(c=>c[0]))+Math.max(...f.map(c=>c[0])))/2,cy=-(Math.min(...f.map(c=>c[1]))+Math.max(...f.map(c=>c[1])))/2,ok=M&&M.sd&&M.sd[p.n];
return `<path class="slot${ok?" ok":""}" data-s="${E(p.n)}" fill="${GC[p.g]}" d="${d}"/>`+(ok&&g!="A"?`<text x="${cx}" y="${cy}" font-size="${fs}">${E(p.n)}</text>`:"")}).join("")+`</svg>`}
function home(){clearInterval(tmr);S=M=null;
$("#app").innerHTML=`<div class=box><h1>🧭 JELAJAH NUSANTARA</h1><p class=sub>Mengenal Provinsi, Ibu Kota, dan Keunikan Daerah di Indonesia</p><div class=isl>⛵ 🏝️ 🌋 🐘 🦜 🧭</div>
${mapSvg("A")}
<label>Nama siswa<input id=nm placeholder="Tulis namamu"></label><label>Kelas<input id=ks value="4"></label>
<label>Mode<select id=md><option value=eval>Evaluasi (dinilai, satu kesempatan)</option><option value=prak>Latihan (ada petunjuk, boleh coba lagi)</option></select></label>
<button class=big onclick=begin()>MULAI PETUALANGAN</button><button class=big2 onclick=teacher()>DASHBOARD GURU</button>
<div class=pet><b>Petunjuk:</b> Ada 3 misi. Misi 1: pasang nama provinsi pada peta (pilih tab pulau). Misi 2: pasangkan ibu kota dengan provinsinya. Misi 3: tebak asal budaya daerah. Pilih kartu lalu ketuk tempatnya, atau seret kartu. Peta digambar sederhana, mendekati bentuk aslinya (bukan batas resmi).</div></div>`}
function begin(){const n=$("#nm").value.trim();if(!n){alert("Isi namamu dulu ya!");return}
const qs=sh(Q).slice(0,15).map(q=>{const d=[...sh(P.filter(p=>p.n!=q.a&&q.x.indexOf(p.n)<0&&p.g==PD[q.a].g)).slice(0,2),...sh(P.filter(p=>p.g!=PD[q.a].g))].slice(0,3).map(p=>p.n);return{...q,o:sh([q.a,...d])}});
S={name:n,cls:$("#ks").value.trim()||"-",mode:$("#md").value,ans:{},sl:sh(P).slice(0,10),qs};
left=(+localStorage.getItem(TK)||0)*60;mission(1);
if(left>0){clearInterval(tmr);tmr=setInterval(()=>{left--;const t=$("#tm");if(t)t.textContent=fmt(left);if(left<=0){clearInterval(tmr);alert("Waktu habis!");finishAll()}},1000)}}
function mission(n){M={n,sel:null,done:{},sd:{},tries:{},g:"S",i:0,lock:0,msg:""};
M.cards=n==1?sh(P):n==2?sh(S.sl):[];draw()}
const pts=()=>Object.values(S.ans).filter(a=>a.ok).length;
function draw(){const n=M.n,tot=n==3?15:n==1?38:10,pr=n==3?M.i:Object.keys(M.done).length;
let h=`<div class=box><div class=top><span>Misi ${n}: ${MN[n-1]}</span><span>⭐ ${pts()}</span><span id=tm>${left?fmt(left):""}</span><button class=sm onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">${mute?"🔇":"🔊"}</button></div>
<div class=pb><i style="width:${pr/tot*100}%"></i></div><div id=msg class=msg>${E(M.msg||(n==3?"Pilih jawaban yang paling tepat.":"Pilih kartu, lalu ketuk atau seret ke tempat yang benar."))}</div>`;
if(n==1){h+=`<div class=tabs>`+["A",...Object.keys(G)].map(g=>{const t=P.filter(p=>g=="A"||p.g==g),d=t.filter(p=>M.done[p.n]).length;return `<button class="tab ${M.g==g?"on":""}" onclick="M.g='${g}';M.sel=null;draw()">${G[g]||"Semua"} ${d}/${t.length}</button>`}).join("")+`</div>`;
h+=mapSvg(M.g);
h+=`<div class=cards>`+M.cards.filter(c=>(M.g=="A"||c.g==M.g)&&!M.done[c.n]).map(c=>cardH(c.n,c.n)).join("")+`</div>`}
if(n==2){h+=`<div class=rows>`+S.sl.map(p=>`<div class=row><b>${E(p.n)}</b><div class="slot ans ${M.sd[p.n]?"ok":""}" data-s="${E(p.n)}">${M.sd[p.n]?E(p.c):"ibu kota?"}</div></div>`).join("")+`</div><div class=cards>`+M.cards.filter(c=>!M.done[c.n]).map(c=>cardH(c.n,c.c)).join("")+`</div>`}
if(n==3){const q=S.qs[M.i];h+=`<div class=q><small>${E(q.k)} - soal ${M.i+1}/15</small><p>${E(q.t)}</p>`+q.o.map(o=>`<button class="opt ${M.sd[o]||""}" ${M.lock||M.sd[o]?"disabled":""} data-o="${E(o)}" onclick="ans3(this.dataset.o)">${E(o)}</button>`).join("")+`</div>`+(M.lock?`<button class=big onclick=nx3()>${M.i==14?"Selesai Misi":"Soal Berikutnya ➜"}</button>`:"")}
else h+=`<button class=big2 onclick=fin()>Selesai Misi ${n}</button>`;
h+=`<button class=sm onclick=quit()>Akhiri permainan</button></div>`;$("#app").innerHTML=h}
const cardH=(id,l)=>`<div class="card ${M.sel==id?"sel":""}" draggable=true data-c="${E(id)}">${E(l)}</div>`;
document.addEventListener("click",e=>{if(!M||!S||M.n==3)return;const c=e.target.closest(".card"),s=e.target.closest(".slot");if(c){M.sel=c.dataset.c;draw()}else if(s)place(s.dataset.s)});
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".card");if(c&&M){M.sel=c.dataset.c;try{e.dataTransfer.setData("text",M.sel)}catch(x){}}});
document.addEventListener("dragover",e=>{if(e.target.closest&&e.target.closest(".slot"))e.preventDefault()});
document.addEventListener("drop",e=>{const s=e.target.closest&&e.target.closest(".slot");if(s&&M){e.preventDefault();place(s.dataset.s)}});
function place(sid){if(!M.sel){$("#msg").textContent="Pilih kartu dulu ya 😊";return}
const cid=M.sel,eva=S.mode=="eval",n=M.n;if(M.done[cid]||M.sd[sid])return;const ok=cid==sid,p=PD[cid];
if(!M.tries[cid]){M.tries[cid]=1;rec(n,cid,n==1?"Letakkan "+cid+" pada peta":"Pasangkan ibu kota "+p.c+" dengan provinsinya",sid,cid,ok)}
snd(ok);
if(ok){M.done[cid]=1;M.sd[sid]=1;M.sel=null;M.msg="🎉 Tepat! "+(n==1?cid+" ada di "+G[p.g]+".":p.c+" adalah ibu kota "+cid+".")}
else if(eva){M.done[cid]=1;M.sel=null;M.msg="❌ Belum tepat. "+(n==1?cid+" ada di "+G[p.g]+".":"Ibu kota "+cid+" adalah "+p.c+".")}
else M.msg="🤔 Belum tepat, coba lagi. Petunjuk: "+(n==1?"provinsi ini ada di "+G[p.g]+".":"provinsinya ada di "+G[p.g]+".");
draw()}
function ans3(o){const q=S.qs[M.i],ok=o==q.a,eva=S.mode=="eval";if(!M.tries[M.i]){M.tries[M.i]=1;rec(3,M.i,"["+q.k+"] "+q.t,o,q.a,ok)}
snd(ok);M.sd[o]=ok?"good":"bad";
if(ok){M.lock=1;M.msg="✅ Benar! Jawabannya "+q.a+"."}else if(eva){M.lock=1;M.sd[q.a]="good";M.msg="❌ Jawaban yang benar: "+q.a+"."}else M.msg="❌ Belum tepat, coba pilihan lain.";draw()}
function nx3(){M.lock=0;M.sd={};M.msg="";M.i++;M.i>14?endM():draw()}
function fin(){const r=(M.n==1?38:10)-Object.keys(M.done).length;if(r&&!confirm("Masih ada "+r+" kartu yang belum dipasang. Yakin selesai?"))return;endM()}
function quit(){if(confirm("Yakin mengakhiri permainan? Hasil yang ada akan dihitung."))finishAll()}
function fillAll(m){if(!m||m==1)P.forEach(p=>rec(1,p.n,"Letakkan "+p.n+" pada peta","-",p.n,false));if(!m||m==2)S.sl.forEach(p=>rec(2,p.n,"Pasangkan ibu kota "+p.c+" dengan provinsinya","-",p.n,false));if(!m||m==3)S.qs.forEach((q,i)=>rec(3,i,"["+q.k+"] "+q.t,"-",q.a,false))}
function endM(){const n=M.n;fillAll(n);const s=st(Object.values(S.ans),n);
$("#app").innerHTML=`<div class=box><h2>${bdg(s.p)} Misi ${n} selesai!</h2><p>Benar ${s.c} dari ${s.t} soal (${s.p}%). Skor misi: <b>${s.p}</b> dari 100 - ${kat(s.p)}</p><p>Lencana: ${bdg(s.p)} ${kat(s.p)}</p><button class=big onclick="${n<3?"mission("+(n+1)+")":"finishAll()"}">${n<3?"Lanjut ke Misi "+(n+1)+" ➜":"Lihat Hasil Akhir"}</button></div>`}
function finishAll(){clearInterval(tmr);if(!S)return;fillAll();const a=Object.values(S.ans),ms=[1,2,3].map(m=>st(a,m));
const r={id:"JN"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:S.name,cls:S.cls,mode:S.mode,t:new Date().toISOString(),ms,fin:Math.round(ms.reduce((x,y)=>x+y.p,0)/3),a};
const all=load();all.push(r);showR(r,save(all),"home()")}
const PI=n=>P.findIndex(p=>p.n==n);
function enc(r){const x=r.a.map(a=>a.m==3?[3,Q.findIndex(q=>"["+q.k+"] "+q.t==a.q),PI(a.u)]:[a.m,PI(a.c),PI(a.u)]);
return "JN1:"+btoa(unescape(encodeURIComponent(JSON.stringify({id:r.id,n:r.name,k:r.cls,e:r.mode,t:r.t,x}))))}
function dec(c){const d=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));
const a=d.x.map(([m,i,u])=>{const us=u<0?"-":P[u].n;if(m==3){const q=Q[i];return{m,q:"["+q.k+"] "+q.t,u:us,c:q.a,ok:us==q.a,k:"3|"+i}}
return{m,q:m==1?"Letakkan "+P[i].n+" pada peta":"Pasangkan ibu kota "+P[i].c+" dengan provinsinya",u:us,c:P[i].n,ok:u==i,k:m+"|"+P[i].n}});
const ms=[1,2,3].map(m=>st(a,m));if(!d.id||a.length!=63)throw 0;
return{id:d.id,name:d.n,cls:d.k,mode:d.e,t:d.t,ms,fin:Math.round(ms.reduce((x,y)=>x+y.p,0)/3),a}}
function cp(){const t=$("#kode");t.select();try{t.setSelectionRange(0,99999);document.execCommand("copy")}catch(e){}try{navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(e){}$("#cpm").textContent="Kode sudah dipilih dan disalin. Jika belum tersalin, tahan lalu pilih Salin. Tempel kode di tugas LMS."}
function impCode(){const m=$("#kd").value.match(/JN1:[A-Za-z0-9+\/=]+/g)||[],a=load(),ids=new Set(a.map(r=>r.id));let c=0,b=0;
m.forEach(x=>{try{const r=dec(x);if(!ids.has(r.id)){ids.add(r.id);a.push(r);c++}}catch(e){b++}});save(a);alert(c+" hasil baru diimpor"+(b?", "+b+" kode tidak valid":"")+(m.length?"":" (tidak ada kode ditemukan)")+".");teacher()}
let LR;function dlOne(){dl("hasil-"+LR.name.replace(/[^\w]+/g,"_")+"-"+LR.id+".json",JSON.stringify([LR]),"application/json")}
function showR(r,ok,back){LR=r;const wt=r.a.filter(x=>!x.ok),gw=new Set(wt.filter(x=>x.m==1).map(x=>PD[x.c].g)),
gp=Object.keys(G).filter(g=>!gw.has(g)&&r.a.some(x=>x.m==1&&PD[x.c].g==g));
const an=r.ms.map((m,i)=>PRE[i]+(m.p>=85?"sudah sangat baik":m.p>=70?"sudah baik":m.p>=55?"cukup, tetap perlu berlatih":"masih perlu banyak berlatih")+" ("+m.p+"%).");
const cat=[...new Set(wt.filter(x=>x.m==3).map(x=>(x.q.match(/^\[(.*?)\]/)||[])[1]))].filter(Boolean);
const m2=wt.filter(x=>x.m==2).map(x=>x.c+" - "+PD[x.c].c);
const rc=[];if(gw.size)rc.push("Pelajari lagi letak provinsi di: "+[...gw].map(g=>G[g]).join(", ")+".");if(m2.length)rc.push("Hafalkan ibu kota: "+m2.join("; ")+".");if(cat.length)rc.push("Pelajari lagi budaya daerah bagian: "+cat.join(", ")+".");if(!rc.length)rc.push("Hebat! Semua materi sudah dikuasai. Coba tantang temanmu!");
let n=0;
$("#app").innerHTML=`<div class=box><h1>🏆 Hasil Petualangan</h1>${ok?"":"<p class=b>Peringatan: hasil gagal disimpan di browser ini.</p>"}
<p><b>${E(r.name)}</b> - Kelas ${E(r.cls)} - ${new Date(r.t).toLocaleString("id-ID")} - Mode ${r.mode=="eval"?"Evaluasi":"Latihan"}</p>
<h2>${bdg(r.fin)} Nilai akhir: ${r.fin} (${kat(r.fin)})</h2><p>Nilai akhir = rata-rata skor tiga misi. Skor misi = (jawaban benar : jumlah soal) x 100.</p>
<div class=wrap><table><tr><th>Misi</th><th>Soal</th><th>Benar</th><th>Salah</th><th>Ketepatan</th><th>Skor</th></tr>${r.ms.map((m,i)=>`<tr><td>${MN[i]}</td><td>${m.t}</td><td>${m.c}</td><td>${m.w}</td><td>${m.p}%</td><td>${m.p}</td></tr>`).join("")}</table></div>
<h3>Analisis kemampuan</h3><ul>${an.map(x=>`<li>${x}</li>`).join("")}${gp.map(g=>`<li>Kamu sudah sangat baik mengenali letak provinsi di ${G[g]}.</li>`).join("")}</ul>
<h3>Rekomendasi belajar</h3><ul>${rc.map(x=>`<li>${E(x)}</li>`).join("")}</ul>
<h3>Riwayat jawaban</h3><div class=wrap><table><tr><th>No</th><th>Soal / tugas</th><th>Jawaban siswa</th><th>Jawaban benar</th><th>Status</th><th>Skor</th></tr>${r.a.map(x=>`<tr><td>${++n}</td><td>M${x.m}: ${E(x.q)}</td><td>${E(x.u)}</td><td>${E(x.c)}</td><td class=${x.ok?"g":"b"}>${x.ok?"Benar":"Salah"}</td><td>${x.ok?+(100/TOT[x.m-1]).toFixed(1):0}</td></tr>`).join("")}</table></div>
${back=="home()"?`<div class=pet><b>Kirim hasilmu ke guru:</b> klik tombol Unduh hasil, lalu unggah file yang terunduh pada tugas di LMS.</div>`:""}<div class=ctl>${back=="home()"?`<button onclick=dlOne() style="background:var(--pr);color:#fff;font-size:1.1em">⬇ Unduh hasil</button>`:""}<button onclick="${back}">Kembali</button><button onclick=print()>Cetak laporan</button></div></div>`}
/* ===== Dashboard guru ===== */
function teacher(){const a=load(),cl=[...new Set(a.map(r=>r.cls))],avg=f=>a.length?Math.round(a.reduce((x,r)=>x+f(r),0)/a.length):0,
ks=[0,1,2].map(i=>avg(r=>r.ms[i].p)),fs=a.map(r=>r.fin),lo=ks.indexOf(Math.min(...ks)),
wc={};a.forEach(r=>r.a.forEach(x=>{if(!x.ok){const k="M"+x.m+": "+x.q;wc[k]=(wc[k]||0)+1}}));
const top=Object.entries(wc).sort((x,y)=>y[1]-x[1]).slice(0,5);
$("#app").innerHTML=`<div class=box><h1>👩‍🏫 Dashboard Guru</h1><button class=sm onclick=home()>⬅ Halaman awal</button>
<div class=st><div>Jumlah siswa<br><b>${a.length}</b></div><div>Rata-rata<br><b>${avg(r=>r.fin)}</b></div><div>Tertinggi<br><b>${a.length?Math.max(...fs):"-"}</b></div><div>Terendah<br><b>${a.length?Math.min(...fs):"-"}</b></div></div>
<h3>Ketepatan per kompetensi (rata-rata kelas)</h3>${KOM.map((k,i)=>`<p>${k}: <b>${ks[i]}%</b></p><div class=bar><i style="width:${ks[i]}%"></i></div>`).join("")}
<h3>Analisis umum kelas</h3><p>${a.length?`Kompetensi paling kuat: ${KOM[ks.indexOf(Math.max(...ks))]}. Perlu penguatan: <b>${KOM[lo]}</b> (${ks[lo]}%).`:"Belum ada data siswa."}</p>
<h3>Soal paling banyak dijawab salah</h3><ol>${top.map(t=>`<li>${E(t[0])} (${t[1]} siswa)</li>`).join("")||"<li>-</li>"}</ol>
<h3>Daftar siswa</h3><div class=ctl><input id=sq placeholder="Cari nama..." oninput="D.q=this.value;tb()"><select id=sk onchange="D.k=this.value;tb()"><option value="">Semua kelas</option>${cl.map(c=>`<option>${E(c)}</option>`).join("")}</select><select onchange="D.s=this.value;tb()"><option value=d>Nilai tertinggi</option><option value=a>Nilai terendah</option><option value=n>Nama A-Z</option></select></div>
<div class=wrap><table id=tb></table></div>
<div class=ctl><button onclick=csv(1)>⬇ Rekap CSV</button><button onclick=csv(2)>⬇ Detail jawaban CSV</button><button onclick=jsn()>⬇ Cadangan JSON</button><label class=sm style="display:inline;margin:0">Impor hasil siswa (JSON, boleh banyak file) <input type=file accept=.json multiple onchange=imp(this) style="width:auto"></label><button onclick=print()>🖨 Cetak</button></div>
<div class=ctl><label style="margin:0">Timer (menit, 0 = tanpa timer)</label><input id=tmi type=number min=0 value="${+localStorage.getItem(TK)||0}"><button onclick="localStorage.setItem(TK,Math.max(0,+$('#tmi').value||0));alert('Timer disimpan')">Simpan timer</button><button onclick=clr() style="background:var(--bad);color:#fff">Hapus semua data</button></div>
<div class=pet>Data tersimpan di localStorage, hanya pada browser dan perangkat ini. Untuk mengumpulkan data dari banyak perangkat: ekspor JSON tiap perangkat lalu impor di satu perangkat, atau pasang Google Apps Script (Web App dengan fungsi doPost yang membaca JSON dan memanggil sheet.appendRow) lalu kirim hasil dengan fetch.</div></div>`;tb()}
function rows(){let a=load().filter(r=>r.name.toLowerCase().includes(D.q.toLowerCase())&&(!D.k||r.cls==D.k));return a.sort((x,y)=>D.s=="n"?x.name.localeCompare(y.name):D.s=="a"?x.fin-y.fin:y.fin-x.fin)}
function tb(){$("#tb").innerHTML=`<tr><th>Nama</th><th>Kelas</th><th>Waktu</th><th>Nilai</th><th>M1</th><th>M2</th><th>M3</th><th>Detail</th></tr>`+rows().map(r=>`<tr><td>${E(r.name)}</td><td>${E(r.cls)}</td><td>${new Date(r.t).toLocaleString("id-ID")}</td><td><b>${r.fin}</b></td><td>${r.ms[0].p}%</td><td>${r.ms[1].p}%</td><td>${r.ms[2].p}%</td><td><button class=sm data-i="${r.id}" onclick=det(this.dataset.i)>Lihat</button></td></tr>`).join("")}
function det(id){const r=load().find(x=>x.id==id);if(r)showR(r,true,"teacher()")}
function dl(n,t,m){const u=URL.createObjectURL(new Blob(["\uFEFF"+t],{type:m})),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove()}
const q2=v=>'"'+String(v).replace(/"/g,'""')+'"';
function csv(k){const L=[];if(k==1){L.push(["Nama","Kelas","Mode","Waktu","Nilai Akhir","Skor Misi 1","Skor Misi 2","Skor Misi 3","Peta %","Ibu Kota %","Budaya %","Kategori"]);rows().forEach(r=>L.push([r.name,r.cls,r.mode,r.t,r.fin,...r.ms.map(m=>m.p),...r.ms.map(m=>m.p),kat(r.fin)]))}
else{L.push(["Nama","Kelas","Waktu","Misi","Soal","Jawaban Siswa","Jawaban Benar","Status"]);rows().forEach(r=>r.a.forEach(x=>L.push([r.name,r.cls,r.t,x.m,x.q,x.u,x.c,x.ok?"Benar":"Salah"])))}
dl(k==1?"rekap-jelajah-nusantara.csv":"detail-jawaban.csv",L.map(l=>l.map(q2).join(";")).join("\r\n"),"text/csv")}
function jsn(){dl("cadangan-jelajah-nusantara.json",JSON.stringify(load(),null,1),"application/json")}
function imp(i){const fs=[...i.files];if(!fs.length)return;let c=0,bad=0,n=0;const a=load(),ids=new Set(a.map(r=>r.id));
fs.forEach(f=>{const R=new FileReader();R.onload=()=>{try{let d=JSON.parse(R.result.replace(/^\uFEFF/,""));if(!Array.isArray(d))d=[d];d.forEach(r=>{if(r&&r.id&&r.ms&&r.a&&!ids.has(r.id)){ids.add(r.id);a.push(r);c++}})}catch(e){bad++}
if(++n==fs.length){save(a);alert(c+" hasil baru diimpor"+(bad?", "+bad+" file tidak valid":"")+".");teacher()}};R.readAsText(f)})}
function clr(){if(confirm("Hapus SEMUA data siswa? Sebaiknya unduh cadangan JSON dulu.")&&confirm("Yakin? Tindakan ini tidak bisa dibatalkan.")){save([]);teacher()}}
home();
</script></body></html>
